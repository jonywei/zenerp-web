{% extends 'base.html' %}
{% block title %}欠款与往来{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="mb-6 border-l-4 border-red-500 pl-3">
        <h1 class="text-2xl font-bold text-gray-800">欠款与往来</h1>
        <p class="text-xs text-gray-400 mt-1">实时统计所有客户/供应商的资金往来</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-red-50 p-5 rounded-2xl border border-red-100">
            <div class="text-sm font-bold text-red-400 uppercase">总应收款 (别人欠我)</div>
            <div class="text-3xl font-black text-red-600 mt-1" id="totalRecv">0.00</div>
        </div>
        <div class="bg-green-50 p-5 rounded-2xl border border-green-100">
            <div class="text-sm font-bold text-green-500 uppercase">总应付款 (我欠别人)</div>
            <div class="text-3xl font-black text-green-600 mt-1" id="totalPay">0.00</div>
        </div>
    </div>

    <div class="bg-white shadow-sm rounded-2xl border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-50 flex justify-between items-center">
            <h3 class="font-bold text-gray-700">往来明细</h3>
            <button onclick="loadFinance()" class="text-blue-500 text-sm font-bold hover:underline">🔄 刷新数据</button>
        </div>
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold">
                <tr>
                    <th class="px-6 py-4">对象 (客户/供应商)</th>
                    <th class="px-6 py-4 text-right">往来金额</th>
                    <th class="px-6 py-4 text-right">状态</th>
                    <th class="px-6 py-4 text-center">操作</th>
                </tr>
            </thead>
            <tbody id="financeList" class="text-sm divide-y divide-gray-100">
                <tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">正在计算...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadFinance() {
        try {
            // 🟢 核心：强制拉取最新数据，不读缓存
            const res = await axios.get('/api/contacts/?page_size=2000&t=' + Date.now());
            const list = res.data.results || res.data;
            
            // 过滤掉余额为 0 的（没有往来的就不显示）
            // 如果您希望显示所有，请注释掉 .filter
            const activeList = list.filter(c => parseFloat(c.balance) !== 0);
            
            renderFinance(activeList);
            calcTotals(activeList);
        } catch(e) {
            document.getElementById('financeList').innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500">加载失败</td></tr>`;
        }
    }

    function calcTotals(list) {
        let recv = 0;
        let pay = 0;
        list.forEach(c => {
            const b = parseFloat(c.balance);
            if (b > 0) recv += b; // 欠我
            if (b < 0) pay += Math.abs(b); // 我欠
        });
        document.getElementById('totalRecv').innerText = '¥ ' + recv.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('totalPay').innerText = '¥ ' + pay.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    function renderFinance(list) {
        const tbody = document.getElementById('financeList');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-10 text-center text-gray-400 bg-gray-50">🎉 暂无欠款往来，账目清爽！</td></tr>`;
            return;
        }

        // 按余额绝对值排序，钱多的排前面
        list.sort((a, b) => Math.abs(parseFloat(b.balance)) - Math.abs(parseFloat(a.balance)));

        tbody.innerHTML = list.map(c => {
            const b = parseFloat(c.balance);
            const isDebt = b > 0; // 欠我
            const colorClass = isDebt ? 'text-red-600' : 'text-green-600';
            const badgeClass = isDebt ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
            const statusText = isDebt ? '欠我款' : '我欠款';
            
            return `
            <tr class="hover:bg-gray-50 transition cursor-pointer" onclick="window.location.href='/contact/detail/${c.id}/'">
                <td class="px-6 py-4">
                    <div class="font-bold text-gray-800 text-base">${c.name}</div>
                    <div class="text-xs text-gray-400 mt-0.5">${c.phone || ''}</div>
                </td>
                <td class="px-6 py-4 text-right font-mono font-bold text-lg ${colorClass}">
                    ¥ ${Math.abs(b).toLocaleString()}
                </td>
                <td class="px-6 py-4 text-right">
                    <span class="${badgeClass} px-3 py-1 rounded-full text-xs font-bold">${statusText}</span>
                </td>
                <td class="px-6 py-4 text-center">
                    <span class="text-blue-500 hover:text-blue-700 font-bold text-xs">去核销 &rarr;</span>
                </td>
            </tr>
            `;
        }).join('');
    }

    loadFinance();
</script>
{% endblock %}
