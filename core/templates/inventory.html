{% extends 'base.html' %}
{% block title %}库存管理{% endblock %}
{% block content %}
<div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <h1 class="text-2xl font-bold text-gray-800 border-l-4 border-orange-500 pl-3">库存清单</h1>
    <div class="flex gap-2 w-full md:w-auto">
        <select id="statusFilter" class="border rounded px-3 py-2 text-sm bg-white font-bold text-blue-600" onchange="loadData()">
            <option value="ALL">📦 全部资产 (含已售)</option>
            <option value="IN_STOCK">🏠 仅看在库</option>
            <option value="RENTED">🚚 仅看外借/在租</option>
            <option value="SOLD">💰 仅看已售</option>
        </select>
        <select id="catFilter" class="border rounded px-3 py-2 text-sm bg-white" onchange="filterList()">
            <option value="">📂 全部分类</option>
            <option value="ZJ">🖥️ 电脑主机</option>
            <option value="XS">📺 显示器</option>
            <option value="SJ">🔩 散件/配件</option>
            <option value="PH">📱 手机 (Phone)</option>
            <option value="TB">📟 平板 (Tablet)</option>
            <option value="ZX">📦 杂项/其他</option>
        </select>
        <input type="text" id="searchInput" placeholder="搜索型号/编码..." class="border rounded px-3 py-2 text-sm w-full md:w-64" oninput="filterList()">
        <a href="/entry/" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-green-700 whitespace-nowrap">+ 入库</a>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-gray-50 text-gray-500 border-b">
                <tr>
                    <th class="px-6 py-3">图片</th>
                    <th class="px-6 py-3">状态/库存概览</th>
                    <th class="px-6 py-3">商品名称 / 配置</th>
                    <th class="px-6 py-3">分类</th>
                    <th class="px-6 py-3">成本</th>
                    <th class="px-6 py-3">入库时间</th>
                </tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-gray-50">
                <tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let allData = [];
    // 🟢 修复：分类映射表同步
    const catMap = { 'ZJ': '电脑主机', 'XS': '显示器', 'SJ': '散件', 'PH': '手机', 'TB': '平板', 'ZX': '杂项' };
    const colorClass = { 'green': 'bg-green-100 text-green-700 border-green-200', 'yellow': 'bg-yellow-100 text-yellow-700 border-yellow-200', 'red': 'bg-red-100 text-red-700 border-red-200' };

    async function loadData() {
        const status = document.getElementById('statusFilter').value;
        try {
            const res = await axios.get(`/api/products/?status=${status}&page_size=1000&t=` + Date.now());
            allData = res.data.results || res.data;
            filterList();
        } catch (err) {
            document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="text-center py-4 text-red-500">加载失败</td></tr>';
        }
    }

    function renderList(list) {
        const tbody = document.getElementById('tbody');
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-gray-400">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(item => {
            const badgeClass = colorClass[item.color_tag] || 'bg-gray-100 text-gray-600';
            const statusText = {'IN_STOCK':'在库', 'RENTED':'在租', 'SOLD':'已售'}[item.status] || item.status;
            const imgSrc = item.image ? item.image : 'https://via.placeholder.com/100x100?text=No+Img';
            const catName = catMap[item.category] || item.category;
            
            let stockInfo = `<span class="px-2 py-1 rounded text-xs border font-bold ${badgeClass}">${statusText}</span>`;
            if (item.stock_counts) {
                stockInfo += `<div class="text-xs text-gray-400 mt-1">总${item.stock_counts.total} | 余${item.stock_counts.in_stock} | 售${item.stock_counts.sold}</div>`;
            }

            return `
            <tr class="hover:bg-gray-50 transition border-b border-gray-50">
                <td class="px-6 py-4">
                    <div class="w-12 h-12 bg-gray-100 rounded overflow-hidden border border-gray-200">
                        <img src="${imgSrc}" class="w-full h-full object-cover">
                    </div>
                </td>
                <td class="px-6 py-4">${stockInfo}</td>
                <td class="px-6 py-4">
                    <div class="font-bold text-gray-800 text-base">${item.name}</div>
                    <div class="text-xs text-gray-500 mt-1 truncate max-w-xs">${item.zencode}</div>
                </td>
                <td class="px-6 py-4"><span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-bold">${catName}</span></td>
                <td class="px-6 py-4 font-bold text-orange-600">¥${parseFloat(item.cost_price).toLocaleString()}</td>
                <td class="px-6 py-4 text-gray-400 text-xs">${item.created_at.split('T')[0]}</td>
            </tr>
            `;
        }).join('');
    }

    function filterList() {
        const k = document.getElementById('searchInput').value.toLowerCase();
        const c = document.getElementById('catFilter').value;
        const filtered = allData.filter(i => {
            const matchName = (i.name && i.name.toLowerCase().includes(k)) || (i.zencode && i.zencode.toLowerCase().includes(k));
            const matchCat = c === '' || i.category === c;
            return matchName && matchCat;
        });
        renderList(filtered);
    }
    
    loadData();
</script>
{% endblock %}
