{% extends 'base.html' %}
{% block title %}销售开单{% endblock %}
{% block content %}
<div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <h1 class="text-2xl font-bold text-gray-800 border-l-4 border-blue-600 pl-3">销售开单</h1>
    <div class="flex gap-2 w-full md:w-auto">
        <input type="text" id="searchInput" placeholder="搜索型号/编码/配置..." class="border rounded-xl px-4 py-2 text-sm w-full md:w-80 shadow-sm" oninput="filterList()">
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="productList">
    </div>

<div id="sellModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-40 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-100">
        <div class="bg-gradient-to-r from-blue-600 to-blue-500 px-6 py-4 flex justify-between items-center">
            <h3 class="text-white font-bold text-lg">商品出库 / 销售</h3>
            <button onclick="closeModal()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full w-8 h-8 flex items-center justify-center transition">&times;</button>
        </div>
        
        <div class="p-6 space-y-4">
            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                <div class="font-bold text-gray-800" id="mName">--</div>
                <div class="text-xs text-gray-500 mt-1 flex justify-between">
                    <span id="mCode">--</span>
                    <span class="bg-white px-2 rounded border text-blue-600" id="mCost">成本: --</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">成交单价 (¥)</label>
                    <input type="number" id="mPrice" class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-800 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">实收金额 (¥)</label>
                    <input type="number" id="mPaid" class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 font-bold text-green-600 focus:border-green-500 outline-none" placeholder="0代表赊账">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">客户 / 买家</label>
                <div class="flex gap-2">
                    <select id="mContact" class="flex-1 border rounded-lg px-3 py-2 bg-gray-50 text-sm font-bold text-gray-700 focus:bg-white transition">
                        <option value="">-- 请选择客户 --</option>
                    </select>
                    <button onclick="showAddContact()" class="bg-blue-100 text-blue-600 px-3 rounded-lg hover:bg-blue-200 font-bold text-xl">+</button>
                </div>
            </div>

            <div id="accBox">
                <label class="block text-xs font-bold text-gray-500 mb-1">收款账户</label>
                <select id="mAccount" class="w-full border rounded-lg px-3 py-2 bg-gray-50 text-sm">
                    </select>
            </div>
            
            <div id="debtTip" class="hidden bg-red-50 text-red-600 text-xs p-2 rounded border border-red-100 font-bold text-center">
                ⚠️ 客户将挂账 ¥<span id="debtVal">0</span>，记入应收欠款
            </div>
        </div>

        <div class="px-6 py-4 bg-gray-50 border-t flex justify-end gap-3">
            <button onclick="closeModal()" class="px-5 py-2 rounded-lg text-gray-600 hover:bg-gray-200 font-bold text-sm">取消</button>
            <button onclick="confirmSell()" class="px-6 py-2 rounded-lg bg-blue-600 text-white shadow-lg hover:bg-blue-700 font-bold text-sm transform active:scale-95 transition">确认出售</button>
        </div>
    </div>
</div>

<div id="addContactModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-6 w-80">
        <h3 class="font-bold text-lg mb-4 text-gray-800">新建客户档案</h3>
        <input id="newCName" class="w-full border rounded-lg h-10 px-3 mb-3 text-sm" placeholder="姓名 (必填)">
        <input id="newCPhone" class="w-full border rounded-lg h-10 px-3 mb-3 text-sm" placeholder="电话">
        <input id="newCAddress" class="w-full border rounded-lg h-10 px-3 mb-3 text-sm" placeholder="地址/备注">
        <div class="flex justify-end gap-2 mt-2">
            <button onclick="document.getElementById('addContactModal').classList.add('hidden')" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-bold text-gray-500">取消</button>
            <button onclick="saveContact()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow">保存</button>
        </div>
    </div>
</div>

<script>
    let products = [], contacts = [], accounts = [];
    let currentProd = null;

    // 初始化加载
    async function init() {
        try {
            // 只加载库存中的商品
            const [pRes, cRes, aRes] = await Promise.all([
                axios.get('/api/products/?status=IN_STOCK&page_size=1000&t='+Date.now()),
                axios.get('/api/contacts/?page_size=1000&t='+Date.now()),
                axios.get('/api/analysis/accounting/?t='+Date.now())
            ]);
            products = pRes.data.results || pRes.data;
            contacts = cRes.data.results || cRes.data;
            accounts = aRes.data.accounts;
            
            renderProducts(products);
            renderContacts();
            renderAccounts();
        } catch (e) {
            alert("数据加载失败，请刷新");
        }
    }

    function renderProducts(list) {
        const div = document.getElementById('productList');
        if(list.length === 0) {
            div.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400 bg-gray-50 rounded-xl border-dashed border-2">暂无可售库存</div>`;
            return;
        }
        div.innerHTML = list.map(p => `
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition group cursor-pointer" onclick="openSell(${p.id})">
                <div class="flex gap-4">
                    <div class="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded font-bold">在库</span>
                            <span class="font-bold text-orange-500">¥${parseFloat(p.retail_price||0).toLocaleString()}</span>
                        </div>
                        <h4 class="font-bold text-gray-800 truncate mt-1">${p.name}</h4>
                        <p class="text-xs text-gray-400 mt-1 truncate">${p.zencode} | ${p.cpu} ${p.gpu}</p>
                        <div class="mt-2 text-right">
                            <button class="bg-blue-50 text-blue-600 px-3 py-1 rounded text-xs font-bold group-hover:bg-blue-600 group-hover:text-white transition">点击开单 ›</button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderContacts(selectedId = null) {
        const sel = document.getElementById('mContact');
        // 保留“散客”选项 (ID为0或空)
        let html = '<option value="">-- 请选择客户 --</option>';
        // 散客
        const guest = contacts.find(c => c.name === '散客' || c.id === 0);
        if(guest) html += `<option value="${guest.id}">🛒 散客</option>`;
        
        contacts.forEach(c => {
            if(c.name !== '散客') {
                html += `<option value="${c.id}">${c.name}</option>`;
            }
        });
        sel.innerHTML = html;
        if(selectedId) sel.value = selectedId;
    }

    function renderAccounts() {
        const sel = document.getElementById('mAccount');
        sel.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name} (¥${a.balance})</option>`).join('');
    }

    function openSell(pid) {
        currentProd = products.find(p => p.id === pid);
        if(!currentProd) return;
        
        document.getElementById('mName').innerText = currentProd.name;
        document.getElementById('mCode').innerText = currentProd.zencode;
        // 只有管理员看成本 (简单逻辑)
        document.getElementById('mCost').innerText = `成本: ¥${parseFloat(currentProd.cost_price).toLocaleString()}`;
        
        document.getElementById('mPrice').value = currentProd.retail_price || '';
        document.getElementById('mPaid').value = '';
        document.getElementById('sellModal').classList.remove('hidden');
        
        // 监听金额变化计算欠款
        document.getElementById('mPrice').oninput = calcDebt;
        document.getElementById('mPaid').oninput = calcDebt;
        calcDebt();
    }

    function calcDebt() {
        const price = parseFloat(document.getElementById('mPrice').value) || 0;
        const paid = parseFloat(document.getElementById('mPaid').value) || 0;
        const debt = price - paid;
        const tip = document.getElementById('debtTip');
        const acc = document.getElementById('accBox');
        
        if(debt > 0) {
            tip.classList.remove('hidden');
            document.getElementById('debtVal').innerText = debt.toLocaleString();
        } else {
            tip.classList.add('hidden');
        }
        
        if(paid > 0) acc.classList.remove('hidden');
        else acc.classList.add('hidden');
    }

    window.showAddContact = () => document.getElementById('addContactModal').classList.remove('hidden');
    
    // 🟢 修复：JS同步获取地址字段
    async function saveContact() {
        const name = document.getElementById('newCName').value;
        const phone = document.getElementById('newCPhone').value;
        const address = document.getElementById('newCAddress').value; // 获取地址
        
        if(!name) return alert("请填写姓名");
        
        try {
            // 真正调用 API
            const res = await axios.post('/api/contacts/', { name, phone, address }); // 发送地址
            const newC = res.data;
            
            // 加入本地列表
            contacts.unshift(newC);
            // 刷新下拉框并选中
            renderContacts(newC.id);
            
            document.getElementById('addContactModal').classList.add('hidden');
            // 清空输入
            document.getElementById('newCName').value = '';
            document.getElementById('newCPhone').value = '';
            document.getElementById('newCAddress').value = ''; // 清空地址
            
        } catch(e) {
            alert("添加失败: " + (e.response?.data?.detail || e.message));
        }
    }

    async function confirmSell() {
        if(!currentProd) return;
        const contactId = document.getElementById('mContact').value;
        const price = document.getElementById('mPrice').value;
        const paid = document.getElementById('mPaid').value || 0;
        const accId = document.getElementById('mAccount').value;

        if(!contactId) return alert("必须选择一个客户（如是路人请选散客）");
        if(!price) return alert("请输入成交价");

        try {
            await axios.post(`/api/products/${currentProd.id}/sell/`, {
                quantity: 1,
                price: price,
                received_amount: paid,
                contact_id: contactId,
                account_id: accId
            });
            
            alert("开单成功！");
            closeModal();
            init(); // 刷新列表
        } catch(e) {
            alert("开单失败: " + (e.response?.data?.detail || e.message));
        }
    }

    window.closeModal = () => document.getElementById('sellModal').classList.add('hidden');
    
    window.filterList = () => {
        const k = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => 
            p.name.toLowerCase().includes(k) || 
            p.zencode.toLowerCase().includes(k) ||
            (p.note && p.note.toLowerCase().includes(k))
        );
        renderProducts(filtered);
    }

    init();
</script>
{% endblock %}
