{% extends 'base.html' %}
{% block title %}客户/供应商档案{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800 border-l-4 border-blue-500 pl-3">客户与往来</h1>
    <div class="flex gap-2">
        <input type="text" id="so" class="border rounded px-4 py-2 w-64" placeholder="🔍 搜姓名/电话..." oninput="filter()">
        <button onclick="showAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700 shadow">+ 新建</button>
    </div>
</div>

<div id="list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

<div id="detailModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-3xl flex flex-col shadow-2xl overflow-hidden max-h-[90vh]">
        <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
            <div><h3 class="font-bold text-xl" id="dName">--</h3><p class="text-xs text-gray-500" id="dPhone">--</p></div>
            <button onclick="closeDetail()" class="text-3xl text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
            <div class="flex gap-4 mb-6">
                <div class="flex-1 bg-gray-50 p-4 rounded border text-center relative overflow-hidden">
                    <div id="dBarColor" class="absolute left-0 top-0 w-1 h-full bg-gray-300"></div>
                    <p class="text-xs text-gray-500 font-bold mb-1">当前余额</p>
                    <p class="text-3xl font-black" id="dBalance">--</p>
                    <p class="text-sm font-bold mt-1" id="dStatus">--</p>
                </div>
                <div class="flex flex-col gap-2 justify-center">
                    <button onclick="doRepay('in')" class="px-4 py-2 bg-green-600 text-white rounded font-bold hover:bg-green-700">收款核销</button>
                    <button onclick="doRepay('out')" class="px-4 py-2 border-2 border-red-100 text-red-500 rounded font-bold hover:bg-red-50">付款核销</button>
                </div>
            </div>
            <h4 class="font-bold text-gray-700 mb-2 border-l-4 border-purple-500 pl-2">交易流水</h4>
            <div class="bg-white border rounded overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left">时间</th><th class="px-4 py-2 text-left">类型</th><th class="px-4 py-2 text-left">内容</th><th class="px-4 py-2 text-right">金额</th></tr></thead><tbody id="dHistory" class="divide-y"></tbody></table></div>
        </div>
    </div>
</div>

<div id="addModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-80 shadow-lg">
        <h3 class="font-bold mb-4">新建档案</h3>
        <input id="cName" class="w-full border rounded h-10 px-3 mb-3" placeholder="姓名 (必填)">
        <input id="cPhone" class="w-full border rounded h-10 px-3 mb-3" placeholder="电话">
        <input id="cAddr" class="w-full border rounded h-10 px-3 mb-4" placeholder="地址">
        <div class="flex justify-end gap-2"><button onclick="document.getElementById('addModal').classList.add('hidden')" class="px-4 py-2 bg-gray-100 rounded">取消</button><button onclick="add()" class="px-4 py-2 bg-blue-600 text-white rounded">保存</button></div>
    </div>
</div>

<script>
    let all=[], accs=[];
    async function load() {
        try {
            const [c, a] = await Promise.all([axios.get('/api/contacts/?page_size=1000&t='+Date.now()), axios.get('/api/analysis/accounting/?t='+Date.now())]);
            all = c.data.results || c.data; accs = a.data.accounts; render(all);
        } catch(e){ alert('加载失败'); }
    }
    function render(list) {
        document.getElementById('list').innerHTML = list.map(c => {
            const b = parseFloat(c.balance);
            let badge = b>0 ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">欠我 ¥${b}</span>` : (b<0 ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">我欠 ¥${Math.abs(b)}</span>` : '');
            return `<div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md cursor-pointer group" onclick="openDetail(${c.id})"><div class="flex justify-between items-start"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold">${c.name.charAt(0)}</div><div><h3 class="font-bold text-gray-800">${c.name}</h3><p class="text-xs text-gray-400">${c.phone||'--'}</p></div></div>${badge}</div><div class="mt-3 pt-3 border-t border-gray-50 flex justify-between text-xs text-gray-400"><span>${c.address||'无地址'}</span><span class="text-blue-500 font-bold opacity-0 group-hover:opacity-100">详情 ›</span></div></div>`;
        }).join('');
    }
    async function openDetail(id) {
        const c = all.find(i=>i.id===id); if(!c) return;
        window.currentId = id;
        document.getElementById('dName').innerText = c.name; document.getElementById('dPhone').innerText = c.phone||'--';
        updateBalanceUI(parseFloat(c.balance));
        document.getElementById('detailModal').classList.remove('hidden');
        try {
            const res = await axios.get(`/api/contacts/${id}/history/?t=`+Date.now());
            document.getElementById('dHistory').innerHTML = res.data.length ? res.data.map(t=>`<tr class="hover:bg-gray-50"><td class="px-4 py-2 text-gray-400 text-xs">${t.date}</td><td class="px-4 py-2"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-bold">${t.type_name}</span></td><td class="px-4 py-2 text-gray-700">${t.target||t.remark}</td><td class="px-4 py-2 text-right font-bold ${t.sign=='+'?'text-green-600':'text-red-600'}">${t.sign} ${parseFloat(t.amount).toLocaleString()}</td></tr>`).join('') : '<tr><td colspan="4" class="p-4 text-center text-gray-400">无记录</td></tr>';
        } catch(e){}
    }
    
    function updateBalanceUI(b) {
        const elB=document.getElementById('dBalance'), elS=document.getElementById('dStatus'), elBar=document.getElementById('dBarColor');
        elB.innerText = '¥ '+Math.abs(b).toLocaleString();
        if(b>0) { elB.className="text-3xl font-black text-red-600"; elS.innerText="对方欠款 (应收)"; elS.className="text-sm font-bold mt-1 text-red-500"; elBar.className="absolute left-0 top-0 w-1 h-full bg-red-500"; }
        else if(b<0) { elB.className="text-3xl font-black text-green-600"; elS.innerText="我方欠款 (应付)"; elS.className="text-sm font-bold mt-1 text-green-500"; elBar.className="absolute left-0 top-0 w-1 h-full bg-green-500"; }
        else { elB.className="text-3xl font-black text-gray-800"; elS.innerText="账目平衡"; elS.className="text-sm font-bold mt-1 text-gray-400"; elBar.className="absolute left-0 top-0 w-1 h-full bg-gray-300"; }
    }

    async function doRepay(type) {
        if(!accs.length) return alert('无资金账户');
        const amt = prompt('请输入金额'); if(!amt) return;
        try { 
            const res = await axios.post(`/api/contacts/${window.currentId}/repay/`, {amount:amt, account_id:accs[0].id, action_type:type}); 
            alert('成功'); 
            // 🟢 核心：直接用后端返回的新余额更新UI，不用等刷新！
            if(res.data.new_balance !== undefined) {
                updateBalanceUI(parseFloat(res.data.new_balance));
                // 同时更新列表里的缓存数据
                const c = all.find(i=>i.id===window.currentId);
                if(c) c.balance = res.data.new_balance;
                render(all);
            } else {
                closeDetail(); load(); 
            }
        } catch(e){ alert('失败'); }
    }
    function closeDetail(){ document.getElementById('detailModal').classList.add('hidden'); }
    function filter(){ const k=document.getElementById('so').value.toLowerCase(); render(all.filter(i=>i.name.toLowerCase().includes(k)||i.phone.includes(k))); }
    window.showAddModal=()=>document.getElementById('addModal').classList.remove('hidden');
    async function add(){ try{ await axios.post('/api/contacts/', {name:document.getElementById('cName').value, phone:document.getElementById('cPhone').value, address:document.getElementById('cAddr').value}); alert('成功'); document.getElementById('addModal').classList.add('hidden'); load(); }catch(e){alert('失败');} }
    load();
</script>
{% endblock %}
