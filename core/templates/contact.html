{% extends 'base.html' %}
{% block title %}客户档案{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h1 class="text-2xl font-bold text-gray-800 border-l-4 border-purple-600 pl-3">客户与供应商档案</h1>
        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" id="searchInput" placeholder="搜索姓名/电话/地址..." class="border rounded-xl px-4 py-2 text-sm w-full md:w-64 shadow-sm" oninput="filterList()">
            <button onclick="showAddModal()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow hover:bg-purple-700 transition flex items-center gap-1">
                <span>+</span> 新建档案
            </button>
        </div>
    </div>

    <div class="bg-white shadow-sm rounded-2xl overflow-hidden border border-gray-100">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold">
                    <tr>
                        <th class="px-6 py-4">ID</th>
                        <th class="px-6 py-4">姓名/称呼</th>
                        <th class="px-6 py-4">电话</th>
                        <th class="px-6 py-4">当前余额 (元)</th>
                        <th class="px-6 py-4 text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="contactList" class="text-sm divide-y divide-gray-100">
                    <tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">正在同步最新档案...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="contactModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-96 transform transition-all">
        <h3 class="font-bold text-xl mb-4 text-gray-800">新建档案</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">姓名 *</label>
                <input id="formName" class="w-full border rounded-xl h-10 px-3 bg-gray-50 focus:bg-white transition" placeholder="客户或供应商姓名">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">电话</label>
                <input id="formPhone" class="w-full border rounded-xl h-10 px-3 bg-gray-50 focus:bg-white transition" placeholder="手机号">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">地址/备注</label>
                <input id="formAddress" class="w-full border rounded-xl h-10 px-3 bg-gray-50 focus:bg-white transition" placeholder="非必填">
            </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
            <button onclick="closeModal()" class="px-5 py-2 bg-gray-100 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-200">取消</button>
            <button onclick="saveContact()" class="px-5 py-2 bg-purple-600 text-white rounded-xl text-sm font-bold shadow hover:bg-purple-700">保存</button>
        </div>
    </div>
</div>

<script>
    let allContacts = [];

    // 🟢 核心修复：进入页面强制拉取最新数据
    async function initData() {
        try {
            // 加时间戳，防止浏览器缓存旧名单
            const res = await axios.get('/api/contacts/?page_size=2000&t=' + Date.now());
            allContacts = res.data.results || res.data;
            renderTable(allContacts);
        } catch (e) {
            document.getElementById('contactList').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">数据同步失败，请刷新页面</td></tr>`;
        }
    }

    function renderTable(list) {
        const tbody = document.getElementById('contactList');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">暂无档案记录</td></tr>`;
            return;
        }
        
        tbody.innerHTML = list.map(c => {
            // 余额红绿逻辑：正数(欠我)红，负数(我欠)绿
            const bal = parseFloat(c.balance);
            let balHtml = `<span class="font-bold text-gray-400">0.00</span>`;
            if (bal > 0) balHtml = `<span class="font-bold text-red-500 bg-red-50 px-2 py-1 rounded">欠我 ${bal.toLocaleString()}</span>`;
            if (bal < 0) balHtml = `<span class="font-bold text-green-600 bg-green-50 px-2 py-1 rounded">我欠 ${Math.abs(bal).toLocaleString()}</span>`;

            return `
            <tr class="hover:bg-gray-50 transition">
                <td class="px-6 py-4 font-mono text-gray-400">#${c.id}</td>
                <td class="px-6 py-4 font-bold text-gray-800">
                    ${c.name}
                    ${c.address ? `<div class="text-xs text-gray-400 font-normal mt-0.5">${c.address}</div>` : ''}
                </td>
                <td class="px-6 py-4 text-gray-600">${c.phone || '-'}</td>
                <td class="px-6 py-4">${balHtml}</td>
                <td class="px-6 py-4 text-center">
                    <button onclick="window.location.href='/contact/detail/${c.id}/'" class="text-blue-600 hover:underline text-xs font-bold bg-blue-50 px-3 py-1.5 rounded-lg">查看详情</button>
                </td>
            </tr>
            `;
        }).join('');
    }

    function filterList() {
        const k = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allContacts.filter(c => 
            c.name.toLowerCase().includes(k) || 
            (c.phone && c.phone.includes(k)) ||
            (c.address && c.address.toLowerCase().includes(k))
        );
        renderTable(filtered);
    }

    // 弹窗逻辑
    window.showAddModal = () => document.getElementById('contactModal').classList.remove('hidden');
    window.closeModal = () => document.getElementById('contactModal').classList.add('hidden');

    async function saveContact() {
        const name = document.getElementById('formName').value;
        const phone = document.getElementById('formPhone').value;
        const address = document.getElementById('formAddress').value;

        if(!name) return alert("姓名必填");

        try {
            // 保存并刷新
            const res = await axios.post('/api/contacts/', { name, phone, address });
            // 将新数据插入头部
            allContacts.unshift(res.data);
            renderTable(allContacts);
            closeModal();
            // 清空
            document.getElementById('formName').value = '';
            document.getElementById('formPhone').value = '';
            document.getElementById('formAddress').value = '';
        } catch(e) {
            alert("保存失败: " + (e.response?.data?.detail || e.message));
        }
    }

    // 启动
    initData();
</script>
{% endblock %}
